name: Publish packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm publishing both packages from the selected branch
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release tag and package versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require publishing confirmation
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM_PUBLISH}" != "true" ]; then
            echo "Confirm publishing both packages before running this workflow." >&2
            exit 1
          fi

      - name: Require the default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "Run this publishing workflow from the main branch." >&2
            exit 1
          fi

      - name: Check package versions match
        id: check-versions
        run: |
          JS_VERSION="$(node -p "require('./packages/js/package.json').version")"
          PYTHON_VERSION="$(python -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml', 'rb'))['project']['version'])")"

          if [ "${PYTHON_VERSION}" != "${JS_VERSION}" ]; then
            echo "JavaScript version ${JS_VERSION} does not match Python version ${PYTHON_VERSION}." >&2
            exit 1
          fi

          echo "version=${JS_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create and push release tag
        id: create-tag
        env:
          RELEASE_VERSION: ${{ steps.check-versions.outputs.version }}
        run: |
          TAG="v${RELEASE_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to publish this version again." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  publish-npm:
    name: Publish JavaScript package to npm
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        working-directory: packages/js

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/js

  build-python:
    name: Build Python distributions
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist
        working-directory: packages/python

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: packages/python/dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish Python package to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/refdatakit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
