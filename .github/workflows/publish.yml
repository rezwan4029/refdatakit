name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release tag and package versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches both package versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          JS_VERSION="$(node -p "require('./packages/js/package.json').version")"
          PYTHON_VERSION="$(python -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml', 'rb'))['project']['version'])")"
          EXPECTED_TAG="v${JS_VERSION}"

          if [ "${PYTHON_VERSION}" != "${JS_VERSION}" ]; then
            echo "JavaScript version ${JS_VERSION} does not match Python version ${PYTHON_VERSION}." >&2
            exit 1
          fi

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}." >&2
            exit 1
          fi

  publish-npm:
    name: Publish JavaScript package to npm
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci
        working-directory: packages/js

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/js

  build-python:
    name: Build Python distributions
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist
        working-directory: packages/python

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: packages/python/dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish Python package to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/refdatakit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
