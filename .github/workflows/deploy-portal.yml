name: Deploy Contributor Portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "schemas/entity.schema.json"
      - "packages/js/src/canonical-json.ts"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: portal
      - name: Require the contribution broker URL
        env:
          VITE_AUTH_BROKER_URL: ${{ vars.VITE_AUTH_BROKER_URL }}
        run: |
          if [ -z "$VITE_AUTH_BROKER_URL" ]; then
            echo "Set the VITE_AUTH_BROKER_URL repository variable before deploying the portal." >&2
            exit 1
          fi
      - run: npm run check
        working-directory: portal
      - run: npm run build
        working-directory: portal
        env:
          PORTAL_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AUTH_BROKER_URL: ${{ vars.VITE_AUTH_BROKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
