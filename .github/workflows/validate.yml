name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
        working-directory: packages/js
      - run: npm run lint
        working-directory: packages/js
      - run: npm test
        working-directory: packages/js
      - run: npm run validate
        working-directory: packages/js
      - run: git diff --exit-code -- schemas/entity.schema.json packages/js/src/generated

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - run: python -m pip install -e "packages/python[dev]"
      - run: ruff check packages/python/src packages/python/tests
      - run: pytest packages/python/tests
      - run: refdatakit validate .
