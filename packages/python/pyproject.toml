[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refdatakit"
version = "0.2.0"
description = "Validated, source-backed reference data for Bangladesh (subdivisions, cities, institutions) with JSON Schema validation tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "RefDataKit contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
refdatakit = "refdatakit.cli:main"

[project.urls]
Homepage = "https://github.com/rezwan4029/refdatakit#readme"
Documentation = "https://github.com/rezwan4029/refdatakit/blob/main/packages/python/README.md"
JavaScript = "https://www.npmjs.com/package/@rezwan4029/refdatakit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refdatakit = ["data/datasets/**/*.json", "data/schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
