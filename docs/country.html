<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>refdatakit — Country Coverage</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqnE=" crossorigin=""></script>

  <!-- Leaflet.markercluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #7c3aed;
      --text: #e8eaf6;
      --muted: #8892b0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-link:hover { color: var(--text); }

    .topbar-flag { font-size: 1.8rem; line-height: 1; }

    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      flex: 1;
    }

    /* ---- Filter pills ---- */
    .filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 100px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      transition: all 0.12s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text); }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(79,142,247,0.15);
    }

    /* ---- Main layout ---- */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-search {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-search input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .sidebar-search input::placeholder { color: var(--muted); }
    .sidebar-search input:focus { border-color: var(--accent); }

    .sidebar-stats {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .stat-chip {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .stat-chip strong { color: var(--accent); }

    .institution-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .inst-item {
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .inst-item:hover { background: var(--card); }
    .inst-item.highlighted { background: rgba(79,142,247,0.12); }

    .inst-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .inst-name {
      font-size: 0.8rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .inst-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    /* ---- Map ---- */
    #map {
      flex: 1;
      z-index: 0;
    }

    /* ---- Leaflet dark overrides ---- */
    .leaflet-container {
      background: #1a1d27 !important;
      font-family: inherit;
    }

    .leaflet-popup-content-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip { background: var(--card); }

    .leaflet-popup-content {
      margin: 10px 14px;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .popup-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
      color: var(--text);
    }

    .popup-tag {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large { background: rgba(79,142,247,0.2) !important; }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background: rgba(79,142,247,0.6) !important;
      color: white !important;
      font-weight: 700;
    }

    /* ---- Responsive ---- */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .topbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a class="back-link" href="index.html">← All countries</a>
    <span class="topbar-flag" id="topbar-flag"></span>
    <span class="topbar-title" id="topbar-title">Loading…</span>
    <div class="filters" id="filters"></div>
  </div>

  <!-- Main layout -->
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-search">
        <input id="search" type="text" placeholder="Search institutions…" autocomplete="off" />
      </div>
      <div class="sidebar-stats" id="sidebar-stats"></div>
      <div class="institution-list" id="inst-list"></div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // ---- Constants ----
    const FLAGS = { BD:"🇧🇩", BT:"🇧🇹", LK:"🇱🇰", MV:"🇲🇻", NP:"🇳🇵", SG:"🇸🇬" };
    const TAG_LABELS = {
      hospital: "Hospital",
      university: "University",
      medical_college: "Medical College",
      polytechnic: "Polytechnic",
      technical_training_institute: "Training Institute",
      k12_school: "School",
      nursing_home: "Nursing Home",
    };
    const TAG_COLORS = {
      hospital:                  "#ef4444",
      university:                "#3b82f6",
      medical_college:           "#f59e0b",
      polytechnic:               "#10b981",
      technical_training_institute: "#8b5cf6",
      k12_school:                "#ec4899",
      nursing_home:              "#06b6d4",
      _default:                  "#8892b0",
    };

    function tagColor(tag) { return TAG_COLORS[tag] ?? TAG_COLORS._default; }

    // ---- Get country code from URL ----
    const params = new URLSearchParams(location.search);
    const cc = (params.get("cc") || "BD").toUpperCase();

    // ---- Load data script dynamically ----
    const script = document.createElement("script");
    script.src = `data/${cc}.js`;
    script.onload = init;
    script.onerror = () => {
      document.getElementById("topbar-title").textContent = `No data for ${cc}`;
    };
    document.head.appendChild(script);

    // ---- Init ----
    function init() {
      const data = window[`__RDK_DATA_${cc}`];
      if (!data) return;

      // Header
      document.title = `refdatakit — ${data.name}`;
      document.getElementById("topbar-flag").textContent = FLAGS[cc] || "🌐";
      document.getElementById("topbar-title").textContent = data.name;

      // Stats chips
      const statsEl = document.getElementById("sidebar-stats");
      const addChip = (n, l) => { statsEl.innerHTML += `<div class="stat-chip"><strong>${n.toLocaleString()}</strong> ${l}</div>`; };
      addChip(data.cities.total, "cities");
      addChip(data.institutions.total, "institutions");
      if (data.subdivisions.total) addChip(data.subdivisions.total, "subdivisions");
      addChip(data.pins.length, "pinned");

      // Map
      const map = L.map("map", {
        preferCanvas: true,
        zoomControl: true,
      });

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 19,
      }).addTo(map);

      if (data.bounds) {
        map.fitBounds(data.bounds, { padding: [30, 30] });
      } else {
        map.setView([20, 90], 5);
      }

      // ---- Build markers ----
      const allTags = [...new Set(data.pins.map(p => p.tag))];
      let activeFilters = new Set(allTags);

      // Cluster group per tag for independent toggle
      const layerGroups = {};
      const markerMap = new Map(); // pin index → marker

      for (const tag of allTags) {
        const cg = L.markerClusterGroup({
          maxClusterRadius: 40,
          iconCreateFunction(cluster) {
            const count = cluster.getChildCount();
            const size = count < 10 ? 30 : count < 100 ? 36 : 42;
            return L.divIcon({
              html: `<div style="background:${tagColor(tag)};opacity:0.85;border-radius:50%;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${size > 36 ? 11 : 10}px;border:2px solid rgba(255,255,255,0.3)">${count}</div>`,
              className: "",
              iconSize: [size, size],
            });
          },
        });
        layerGroups[tag] = cg;
        map.addLayer(cg);
      }

      function makeIcon(tag) {
        const c = tagColor(tag);
        return L.divIcon({
          html: `<div style="background:${c};width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,0.6);box-shadow:0 0 6px ${c}88"></div>`,
          className: "",
          iconSize: [12, 12],
          iconAnchor: [6, 6],
        });
      }

      data.pins.forEach((pin, i) => {
        const marker = L.marker([pin.lat, pin.lng], { icon: makeIcon(pin.tag) });
        marker.bindPopup(`
          <div class="popup-title">${escHtml(pin.name)}</div>
          <div class="popup-tag">${TAG_LABELS[pin.tag] || pin.tag} · ${escHtml(pin.city)}</div>
        `);
        marker._pinIndex = i;
        markerMap.set(i, marker);
        if (layerGroups[pin.tag]) {
          layerGroups[pin.tag].addLayer(marker);
        }
      });

      // ---- Filter buttons ----
      const filtersEl = document.getElementById("filters");
      for (const tag of allTags) {
        const count = data.pins.filter(p => p.tag === tag).length;
        const btn = document.createElement("button");
        btn.className = "filter-btn active";
        btn.style.borderColor = tagColor(tag);
        btn.style.color = tagColor(tag);
        btn.dataset.tag = tag;
        btn.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${tagColor(tag)};margin-right:5px"></span>${TAG_LABELS[tag] || tag} <strong>${count}</strong>`;
        btn.addEventListener("click", () => {
          if (activeFilters.has(tag)) {
            activeFilters.delete(tag);
            map.removeLayer(layerGroups[tag]);
            btn.classList.remove("active");
            btn.style.opacity = "0.4";
          } else {
            activeFilters.add(tag);
            map.addLayer(layerGroups[tag]);
            btn.classList.add("active");
            btn.style.opacity = "1";
          }
          renderList(currentQuery());
        });
        filtersEl.appendChild(btn);
      }

      // ---- Sidebar list ----
      const listEl = document.getElementById("inst-list");
      const searchEl = document.getElementById("search");

      function currentQuery() { return searchEl.value.toLowerCase().trim(); }

      function renderList(query) {
        listEl.innerHTML = "";
        const filtered = data.pins.filter(p =>
          activeFilters.has(p.tag) &&
          (!query || p.name.toLowerCase().includes(query) || p.city.toLowerCase().includes(query))
        );

        const slice = filtered.slice(0, 300);
        for (const pin of slice) {
          const item = document.createElement("div");
          item.className = "inst-item";
          item.dataset.idx = pin._idx ?? data.pins.indexOf(pin);
          item.innerHTML = `
            <div class="inst-dot" style="background:${tagColor(pin.tag)}"></div>
            <div>
              <div class="inst-name">${escHtml(pin.name)}</div>
              <div class="inst-meta">${TAG_LABELS[pin.tag] || pin.tag} · ${escHtml(pin.city)}</div>
            </div>`;
          item.addEventListener("click", () => {
            const idx = parseInt(item.dataset.idx);
            const marker = markerMap.get(idx);
            if (marker) {
              map.setView([data.pins[idx].lat, data.pins[idx].lng], 14);
              setTimeout(() => marker.openPopup(), 300);
            }
          });
          listEl.appendChild(item);
        }

        if (filtered.length > 300) {
          listEl.innerHTML += `<div style="text-align:center;padding:1rem;font-size:0.75rem;color:var(--muted)">Showing 300 of ${filtered.length.toLocaleString()} — refine your search</div>`;
        }

        if (filtered.length === 0) {
          listEl.innerHTML = `<div style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.8rem">No results</div>`;
        }
      }

      searchEl.addEventListener("input", () => renderList(currentQuery()));
      renderList("");
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
